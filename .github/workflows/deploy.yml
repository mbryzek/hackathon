# Deploy bthackathon.com on every push to main, and on demand from the Actions tab.
#
# It runs scripts/deploy, which needs two repository secrets and nothing else:
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID. README.md, "Deploying", has how to
# make both. A repository that has not set them yet deploys nothing: the first job
# sees the token is missing, says so, and the deploy job is skipped rather than failed.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, and never cancel one halfway: a newer push waits for the
# running deploy, then deploys its own commit.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  configured:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Not deploying: set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (README.md, Deploying)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: configured
    if: needs.configured.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # .nvmrc holds the fleet's declared Node line (devops Agent_node), the one
      # package.json's `engines` admits; npm refuses any other (.npmrc sets
      # engine-strict).
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: scripts/deploy
